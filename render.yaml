services:
  - type: web
    name: russia-media-reports
    branch: cursor/russia-reports-main-d482
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: LANDING_PATH
        value: "/russia"
      - key: RUSSIA_CACHE_TTL
        value: "600"
