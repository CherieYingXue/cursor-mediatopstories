services:
  - type: web
    name: russia-media-reports
    branch: cursor/russian-media-top-stories-d482
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: LANDING_PATH
        value: "/russia"
      - key: DAILY_RUN_HOUR
        value: "8"
      - key: DAILY_RUN_MINUTE
        value: "0"
