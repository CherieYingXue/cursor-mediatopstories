<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>昼夜 24 小时表</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --day: #6ec8f0;
      --night: #3d4452;
      --ring: #e8eef4;
      --text: #f0f4f8;
      --muted: #94a3b8;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
      touch-action: manipulation;
    }
    .app {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: calc(12px + var(--safe-top)) 12px calc(16px + var(--safe-bottom));
    }
    .digital {
      text-align: center;
      margin-bottom: 8px;
      user-select: none;
    }
    .digital .time {
      font-size: clamp(2rem, 9vw, 2.75rem);
      font-weight: 300;
      letter-spacing: 0.06em;
      font-variant-numeric: tabular-nums;
    }
    .digital .date {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
    }
    .clock-wrap {
      width: min(92vw, 92vh, 420px);
      aspect-ratio: 1;
      position: relative;
    }
    .clock-wrap svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.35));
    }
    .meta {
      margin-top: 14px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.5;
      max-width: 340px;
      user-select: none;
    }
    .meta strong { font-weight: 600; }
    .meta .sun-line strong { color: #fbbf24; }
    .meta .moon-line strong { color: #c4b5fd; }
    .loc-btn {
      margin-top: 10px;
      border: 1px solid #475569;
      background: rgba(30, 41, 59, 0.8);
      color: var(--text);
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .loc-btn:active { background: #334155; }
  </style>
</head>
<body>
  <div class="app">
    <div class="digital">
      <div class="time" id="timeText">--:--:--</div>
      <div class="date" id="dateText"></div>
    </div>

    <div class="clock-wrap">
      <svg viewBox="0 0 400 400" aria-label="24小时昼夜表盘">
        <defs>
          <clipPath id="dialClip">
            <circle cx="200" cy="200" r="188"/>
          </clipPath>
          <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="2.5" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <g id="symSun" filter="url(#glow)">
            <circle r="16" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
            <g stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round">
              <line y1="-22" y2="-28"/><line y1="22" y2="28"/>
              <line x1="-22" x2="-28"/><line x1="22" x2="28"/>
              <line x1="-16" y1="-16" x2="-20" y2="-20"/>
              <line x1="16" y1="16" x2="20" y2="20"/>
              <line x1="16" y1="-16" x2="20" y2="-20"/>
              <line x1="-16" y1="16" x2="-20" y2="20"/>
            </g>
          </g>
          <g id="symMoon" filter="url(#glow)">
            <circle r="16" fill="#c4b5fd" stroke="#8b5cf6" stroke-width="2"/>
            <circle cx="7" cy="-3" r="12" fill="#1a1a2e"/>
          </g>
        </defs>

        <!-- 浅蓝=天际线上方；深灰仅天际线下方（日出—日落之间）；其余为表盘底色 -->
        <g clip-path="url(#dialClip)">
          <circle cx="200" cy="200" r="188" fill="#252a3d"/>
          <path id="faceNight" fill="var(--night)"/>
          <path id="faceDay" fill="var(--day)"/>
          <path id="horizonRidge" fill="none" stroke="rgba(126,210,248,0.95)" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <circle cx="200" cy="200" r="188" fill="none" stroke="var(--ring)" stroke-width="3" opacity="0.9"/>

        <g id="solarTerms"></g>
        <g id="yearTicks"></g>
        <g id="ticks"></g>
        <g id="weekWheel"></g>
        <g id="calendarHands">
          <line id="handDate" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round"/>
          <line id="handWeek" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round"/>
          <circle cx="200" cy="200" r="5" fill="#0f172a"/>
        </g>
        <g id="eventLabels"></g>
        <g id="marker"></g>
      </svg>
    </div>

    <div class="meta">
      <div class="sun-line">☀ 日出 <strong id="sunriseText">--:--</strong></div>
      <div class="moon-line">☽ 日落 <strong id="sunsetText">--:--</strong></div>
      <div id="locText">定位中…</div>
    </div>
    <button type="button" class="loc-btn" id="locBtn">使用当前位置计算日出日落</button>
  </div>

  <script src="https://unpkg.com/suncalc@1.9.0/suncalc.js"></script>
  <script>
(function () {
  const CX = 200, CY = 200, R = 188;
  const TICK_OUTER = 172, TICK_INNER = 162, LABEL_R = 148, MARKER_R = 156;
  const TERM_IN = 60, TERM_OUT = 118, TERM_LABEL_R = 102;
  const YEAR_TICK_OUT = 120, YEAR_TICK_IN = 117;
  const YEAR_HAND_R = 119;
  const WEEK_R = 50, WEEK_HAND_R = 32;
  const WEEK_TOP = 180;
  const WEEK_NAMES = ["一", "二", "三", "四", "五", "六", "日"];
  const SOLAR_TERM_NAMES = [
    "小寒", "大寒", "立春", "雨水", "惊蛰", "春分", "清明", "谷雨",
    "立夏", "小满", "芒种", "夏至", "小暑", "大暑", "立秋", "处暑",
    "白露", "秋分", "寒露", "霜降", "立冬", "小雪", "大雪", "冬至",
  ];
  const SOLAR_TERM_DAYS = [
    6, 20, 34, 49, 64, 79, 94, 109, 124, 139, 154, 169,
    184, 199, 214, 229, 244, 259, 274, 289, 304, 319, 334, 349,
  ];
  const TERM_COLORS = [
    "#6a9eb8", "#6a9eb8", "#7ec8a0", "#7ec8a0", "#8ed4aa", "#8ed4aa",
    "#9edca8", "#9edca8", "#e89090", "#e89090", "#f0a0a0", "#f0a0a0",
    "#e88888", "#e88888", "#d4a86a", "#d4a86a", "#c9a060", "#c9a060",
    "#b89858", "#b89858", "#8aa8be", "#8aa8be", "#7a9eb8", "#7a9eb8",
  ];

  const timeText = document.getElementById("timeText");
  const dateText = document.getElementById("dateText");
  const sunriseText = document.getElementById("sunriseText");
  const sunsetText = document.getElementById("sunsetText");
  const locText = document.getElementById("locText");
  const locBtn = document.getElementById("locBtn");
  const ticksG = document.getElementById("ticks");
  const solarTermsG = document.getElementById("solarTerms");
  const yearTicksG = document.getElementById("yearTicks");
  const weekWheelG = document.getElementById("weekWheel");
  const handDate = document.getElementById("handDate");
  const handWeek = document.getElementById("handWeek");
  const eventLabelsG = document.getElementById("eventLabels");
  const markerG = document.getElementById("marker");
  const faceDay = document.getElementById("faceDay");
  const faceNight = document.getElementById("faceNight");
  const horizonRidge = document.getElementById("horizonRidge");

  const NS = "http://www.w3.org/2000/svg";
  let lat = 39.9042;
  let lng = 116.4074;
  let locLabel = "北京（默认）";
  const WEEK = ["日", "一", "二", "三", "四", "五", "六"];

  function pad(n) { return String(n).padStart(2, "0"); }

  /**
   * 24 小时刻度方位（顺时针）：
   * 0 点正下方，6 点左侧，12 点正上方，18 点右侧。
   * 角度 = 从正下方起算的顺时针度数。
   */
  function minutesToAngle(min) {
    return (min / 1440) * 360;
  }

  function daysInYear(y) {
    return (y % 4 === 0 && (y % 100 !== 0 || y % 400 === 0)) ? 366 : 365;
  }

  function dayOfYear(date) {
    const start = new Date(date.getFullYear(), 0, 0);
    return Math.floor((date - start) / 86400000);
  }

  /** 公历日期角度（1月1日起算，未旋转） */
  function rawYearAngle(doy, total) {
    return (180 + ((doy - 1) / total) * 360) % 360;
  }

  /** 大寒—立春交界在正上方（24 节气圈与 365 刻度共用） */
  const TERM_TOP_DAY = (SOLAR_TERM_DAYS[1] + SOLAR_TERM_DAYS[2]) / 2;
  const TERM_RING_OFFSET =
    (180 - rawYearAngle(TERM_TOP_DAY, 365) + 360) % 360;

  function yearRingAngle(doy, total) {
    return (rawYearAngle(doy, total) + TERM_RING_OFFSET) % 360;
  }

  function isoWeekday(date) {
    const d = date.getDay();
    return d === 0 ? 7 : d;
  }

  function weekSectorPath(index) {
    const a0 = WEEK_TOP + (index / 7) * 360;
    const a1 = WEEK_TOP + ((index + 1) / 7) * 360;
    const p0 = angleToXY(a0, WEEK_R);
    const p1 = angleToXY(a1, WEEK_R);
    return (
      "M " + CX + " " + CY +
      " L " + p0.x.toFixed(2) + " " + p0.y.toFixed(2) +
      " A " + WEEK_R + " " + WEEK_R + " 0 0,1 " +
      p1.x.toFixed(2) + " " + p1.y.toFixed(2) + " Z"
    );
  }

  function weekMidAngle(index) {
    return (WEEK_TOP + ((index + 0.5) / 7) * 360) % 360;
  }

  function termSectorPath(a0, a1) {
    const p0in = angleToXY(a0, TERM_IN);
    const p1in = angleToXY(a1, TERM_IN);
    const p1out = angleToXY(a1, TERM_OUT);
    const p0out = angleToXY(a0, TERM_OUT);
    const sweep = (a1 - a0 + 360) % 360;
    const large = sweep > 180 ? 1 : 0;
    return (
      "M " + p0in.x.toFixed(2) + " " + p0in.y.toFixed(2) +
      " L " + p1in.x.toFixed(2) + " " + p1in.y.toFixed(2) +
      " A " + TERM_IN + " " + TERM_IN + " 0 " + large + ",1 " +
      p1out.x.toFixed(2) + " " + p1out.y.toFixed(2) +
      " L " + p0out.x.toFixed(2) + " " + p0out.y.toFixed(2) +
      " A " + TERM_OUT + " " + TERM_OUT + " 0 " + large + ",0 " +
      p0in.x.toFixed(2) + " " + p0in.y.toFixed(2) + " Z"
    );
  }

  /** 相邻节气之间的中点（跨年：冬至→小寒 等） */
  function midpointDay(dayA, dayB) {
    if (dayB >= dayA) return (dayA + dayB) / 2;
    const span = 365 - dayA + dayB;
    let mid = dayA + span / 2;
    if (mid > 365) mid -= 365;
    return mid;
  }

  function termSectorBounds(index) {
    const prev = SOLAR_TERM_DAYS[(index + 23) % 24];
    const cur = SOLAR_TERM_DAYS[index];
    const next = SOLAR_TERM_DAYS[(index + 1) % 24];
    const d0 = midpointDay(prev, cur);
    const d1 = midpointDay(cur, next);
    return { a0: yearRingAngle(d0, 365), a1: yearRingAngle(d1, 365) };
  }

  function setRadialHand(lineEl, deg, len) {
    const tip = angleToXY(deg, len);
    lineEl.setAttribute("x1", CX);
    lineEl.setAttribute("y1", CY);
    lineEl.setAttribute("x2", tip.x.toFixed(2));
    lineEl.setAttribute("y2", tip.y.toFixed(2));
  }

  function angleToXY(deg, radius) {
    const rad = (deg * Math.PI) / 180;
    return {
      x: CX - radius * Math.sin(rad),
      y: CY + radius * Math.cos(rad),
    };
  }

  function minutesOfDay(d) {
    return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60 + d.getMilliseconds() / 60000;
  }

  function formatHM(d) {
    return pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  function getSunTimes(date) {
    const t = SunCalc.getTimes(date, lat, lng);
    return { sunrise: t.sunrise, sunset: t.sunset };
  }

  function waveOffset(t) {
    return (
      5 * Math.sin(t * Math.PI * 4.1) +
      3 * Math.sin(t * Math.PI * 8.3 + 0.6) +
      1.8 * Math.sin(t * Math.PI * 15 + 1.2)
    );
  }

  function clampToCircle(x, y) {
    const dx = x - CX;
    const dy = y - CY;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d <= R - 0.5) return { x, y };
    const s = (R - 1) / d;
    return { x: CX + dx * s, y: CY + dy * s };
  }

  function polyPath(points, close) {
    if (!points.length) return "";
    let d = "M " + points[0].x.toFixed(2) + " " + points[0].y.toFixed(2);
    for (let i = 1; i < points.length; i++) {
      d += " L " + points[i].x.toFixed(2) + " " + points[i].y.toFixed(2);
    }
    return close ? d + " Z" : d;
  }

  /**
   * 参考图：日出—日落之间一条近似水平的起伏天际线；
   * 端点在表盘对应时刻；线上方浅蓝（白天），线下方深灰（夜晚）。
   */
  function buildSkylinePaths(sunrise, sunset) {
    const riseDeg = minutesToAngle(minutesOfDay(sunrise));
    const setDeg = minutesToAngle(minutesOfDay(sunset));
    const daySweep = (setDeg - riseDeg + 360) % 360;
    const nightSweep = 360 - daySweep;
    const steps = 88;

    const S = angleToXY(riseDeg, R);
    const E = angleToXY(setDeg, R);
    const topRim = [];
    const bottomRim = [];
    const ridge = [];

    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const dayDeg = (riseDeg + daySweep * t) % 360;
      const nightDeg = (riseDeg - nightSweep * t + 360) % 360;
      topRim.push(angleToXY(dayDeg, R));
      bottomRim.push(angleToXY(nightDeg, R));
    }

    ridge.push(S);
    for (let i = 1; i < steps; i++) {
      const t = i / steps;
      const x = S.x + (E.x - S.x) * t;
      const y = S.y + (E.y - S.y) * t - waveOffset(t);
      ridge.push(clampToCircle(x, y));
    }
    ridge.push(E);

    const dayPolygon = topRim.concat(ridge.slice(1, -1).reverse());
    const nightPolygon = ridge.concat(bottomRim.slice(0, -1).reverse());

    return {
      dayPath: polyPath(dayPolygon, true),
      nightPath: polyPath(nightPolygon, true),
      ridge: polyPath(ridge, false),
      S,
      E,
    };
  }

  function buildSkyFace(sunrise, sunset) {
    const p = buildSkylinePaths(sunrise, sunset);
    faceDay.setAttribute("d", p.dayPath);
    faceNight.setAttribute("d", p.nightPath);
    horizonRidge.setAttribute("d", p.ridge);
    return p;
  }

  function buildYearTicks() {
    yearTicksG.innerHTML = "";
    const monthStarts = [1, 32, 60, 91, 121, 152, 182, 213, 244, 274, 305, 335];
    for (let d = 1; d <= 365; d++) {
      const deg = yearRingAngle(d, 365);
      const isMonth = monthStarts.indexOf(d) >= 0;
      const p1 = angleToXY(deg, YEAR_TICK_OUT);
      const p2 = angleToXY(deg, isMonth ? YEAR_TICK_IN - 1 : YEAR_TICK_IN);
      const line = document.createElementNS(NS, "line");
      line.setAttribute("x1", p1.x);
      line.setAttribute("y1", p1.y);
      line.setAttribute("x2", p2.x);
      line.setAttribute("y2", p2.y);
      line.setAttribute("stroke", isMonth ? "rgba(255,255,255,0.35)" : "rgba(255,255,255,0.14)");
      line.setAttribute("stroke-width", isMonth ? "1.2" : "0.7");
      line.setAttribute("stroke-linecap", "round");
      yearTicksG.appendChild(line);
    }
  }

  function buildSolarTermRing() {
    solarTermsG.innerHTML = "";
    for (let i = 0; i < 24; i++) {
      const b = termSectorBounds(i);
      const path = document.createElementNS(NS, "path");
      path.setAttribute("d", termSectorPath(b.a0, b.a1));
      path.setAttribute("fill", TERM_COLORS[i]);
      path.setAttribute("stroke", "rgba(40,70,50,0.35)");
      path.setAttribute("stroke-width", "0.6");
      solarTermsG.appendChild(path);

      const mid = yearRingAngle(SOLAR_TERM_DAYS[i], 365);
      const lp = angleToXY(mid, TERM_LABEL_R);
      const text = document.createElementNS(NS, "text");
      text.setAttribute("x", lp.x);
      text.setAttribute("y", lp.y + 3);
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("fill", "rgba(255,255,255,0.92)");
      text.setAttribute("font-size", "8");
      text.setAttribute("font-weight", "600");
      text.textContent = SOLAR_TERM_NAMES[i];
      solarTermsG.appendChild(text);
    }
    const outer = document.createElementNS(NS, "circle");
    outer.setAttribute("cx", CX);
    outer.setAttribute("cy", CY);
    outer.setAttribute("r", TERM_OUT);
    outer.setAttribute("fill", "none");
    outer.setAttribute("stroke", "rgba(120,150,110,0.55)");
    outer.setAttribute("stroke-width", "1.5");
    solarTermsG.appendChild(outer);
    const inner = document.createElementNS(NS, "circle");
    inner.setAttribute("cx", CX);
    inner.setAttribute("cy", CY);
    inner.setAttribute("r", TERM_IN);
    inner.setAttribute("fill", "none");
    inner.setAttribute("stroke", "rgba(120,150,110,0.4)");
    inner.setAttribute("stroke-width", "1");
    solarTermsG.appendChild(inner);
  }

  function buildWeekWheel() {
    weekWheelG.innerHTML = "";
    const colors = [
      "#e8a04a", "#e8a04a", "#e8a04a", "#e8a04a", "#e8a04a",
      "#7cbd5c", "#7cbd5c",
    ];
    for (let i = 0; i < 7; i++) {
      const path = document.createElementNS(NS, "path");
      path.setAttribute("d", weekSectorPath(i));
      path.setAttribute("fill", colors[i]);
      path.setAttribute("stroke", "rgba(30,41,59,0.5)");
      path.setAttribute("stroke-width", "1");
      weekWheelG.appendChild(path);

      const mid = angleToXY(weekMidAngle(i), WEEK_R * 0.55);
      const text = document.createElementNS(NS, "text");
      text.setAttribute("x", mid.x);
      text.setAttribute("y", mid.y + 4);
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("fill", "#3d2f1f");
      text.setAttribute("font-size", "10");
      text.setAttribute("font-weight", "700");
      text.textContent = WEEK_NAMES[i];
      weekWheelG.appendChild(text);
    }
    const ring = document.createElementNS(NS, "circle");
    ring.setAttribute("cx", CX);
    ring.setAttribute("cy", CY);
    ring.setAttribute("r", WEEK_R);
    ring.setAttribute("fill", "none");
    ring.setAttribute("stroke", "rgba(30,41,59,0.55)");
    ring.setAttribute("stroke-width", "1.5");
    weekWheelG.appendChild(ring);
  }

  function updateCalendarHands(now) {
    const y = now.getFullYear();
    const total = daysInYear(y);
    const doy = dayOfYear(now);
    const dateDeg = yearRingAngle(doy, total);
    const weekIdx = isoWeekday(now) - 1;
    const weekDeg = weekMidAngle(weekIdx);
    setRadialHand(handDate, dateDeg, YEAR_HAND_R);
    setRadialHand(handWeek, weekDeg, WEEK_HAND_R);
  }

  function buildTicks() {
    ticksG.innerHTML = "";
    for (let h = 0; h < 24; h++) {
      const deg = minutesToAngle(h * 60);
      const p1 = angleToXY(deg, TICK_OUTER);
      const p2 = angleToXY(deg, TICK_INNER);
      const major = h % 6 === 0;
      const line = document.createElementNS(NS, "line");
      line.setAttribute("x1", p1.x);
      line.setAttribute("y1", p1.y);
      line.setAttribute("x2", p2.x);
      line.setAttribute("y2", p2.y);
      line.setAttribute("stroke", major ? "rgba(255,255,255,0.9)" : "rgba(255,255,255,0.5)");
      line.setAttribute("stroke-width", major ? "2.5" : "1.2");
      line.setAttribute("stroke-linecap", "round");
      ticksG.appendChild(line);

      const lbl = angleToXY(deg, LABEL_R);
      const text = document.createElementNS(NS, "text");
      text.setAttribute("x", lbl.x);
      text.setAttribute("y", lbl.y + 4);
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("fill", major ? "rgba(255,255,255,0.95)" : "rgba(255,255,255,0.65)");
      text.setAttribute("font-size", major ? "11" : "9");
      text.setAttribute("font-weight", major ? "600" : "400");
      text.textContent = String(h);
      ticksG.appendChild(text);
    }
  }

  function placeHorizonLabel(text, x, y, color) {
    const t = document.createElementNS(NS, "text");
    t.setAttribute("x", x);
    t.setAttribute("y", y);
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("fill", color);
    t.setAttribute("font-size", "9");
    t.setAttribute("font-weight", "600");
    t.setAttribute("opacity", "0.85");
    t.textContent = text;
    eventLabelsG.appendChild(t);
  }

  function placeEventLabel(text, time, color) {
    const deg = minutesToAngle(minutesOfDay(time));
    const p = angleToXY(deg, LABEL_R - 22);
    const t = document.createElementNS(NS, "text");
    t.setAttribute("x", p.x);
    t.setAttribute("y", p.y + 3);
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("fill", color);
    t.setAttribute("font-size", "10");
    t.setAttribute("font-weight", "600");
    t.textContent = text;
    eventLabelsG.appendChild(t);
  }

  function isDaytime(now, sunrise, sunset) {
    const m = minutesOfDay(now);
    const riseM = minutesOfDay(sunrise);
    const setM = minutesOfDay(sunset);
    return m >= riseM && m < setM;
  }

  function setMarker(now, sunrise, sunset) {
    const deg = minutesToAngle(minutesOfDay(now));
    const pos = angleToXY(deg, MARKER_R);
    const day = isDaytime(now, sunrise, sunset);
    markerG.innerHTML = "";
    const g = document.createElementNS(NS, "g");
    g.setAttribute("transform", "translate(" + pos.x + "," + pos.y + ")");
    const use = document.createElementNS(NS, "use");
    use.setAttribute("href", day ? "#symSun" : "#symMoon");
    g.appendChild(use);
    markerG.appendChild(g);
  }

  function tick() {
    const now = new Date();
    const { sunrise, sunset } = getSunTimes(now);

    timeText.textContent =
      pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
    dateText.textContent =
      now.getFullYear() + "年" + (now.getMonth() + 1) + "月" + now.getDate() + "日 星期" + WEEK[now.getDay()];

    sunriseText.textContent = formatHM(sunrise);
    sunsetText.textContent = formatHM(sunset);

    const sky = buildSkyFace(sunrise, sunset);
    eventLabelsG.innerHTML = "";
    placeHorizonLabel("日出", sky.S.x, sky.S.y - 18, "#fef3c7");
    placeHorizonLabel("日落", sky.E.x, sky.E.y + 14, "#fde68a");

    setMarker(now, sunrise, sunset);
    updateCalendarHands(now);
    locText.textContent = locLabel;
  }

  function requestLocation() {
    if (!navigator.geolocation) {
      locText.textContent = locLabel + "（设备不支持定位，使用默认坐标）";
      return;
    }
    locBtn.disabled = true;
    locBtn.textContent = "定位中…";
    navigator.geolocation.getCurrentPosition(
      function (pos) {
        lat = pos.coords.latitude;
        lng = pos.coords.longitude;
        locLabel = "纬度 " + lat.toFixed(2) + "° · 经度 " + lng.toFixed(2) + "°";
        locBtn.disabled = false;
        locBtn.textContent = "使用当前位置计算日出日落";
        tick();
      },
      function () {
        locBtn.disabled = false;
        locBtn.textContent = "使用当前位置计算日出日落";
        locText.textContent = locLabel + "（定位失败，仍用默认坐标）";
      },
      { enableHighAccuracy: false, timeout: 12000, maximumAge: 300000 }
    );
  }

  buildSolarTermRing();
  buildYearTicks();
  buildWeekWheel();
  buildTicks();
  locBtn.addEventListener("click", requestLocation);
  requestLocation();
  tick();
  setInterval(tick, 200);
})();
  </script>
</body>
</html>
